[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-layer"
version = "0.1.0"
description = "Five-dimension identity trust assessment for health information exchanges"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Hamza Shekhani", email = "hamzashekhani650@gmail.com" }
]
dependencies = [
    "flask>=3.0",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hamzashekhani650-cell/identity-trust-assessment"

[tool.setuptools.packages.find]
include = ["trust_layer*"]